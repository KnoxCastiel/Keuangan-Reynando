<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keuangan Reynando</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen pb-24 transition-colors">

  <!-- Header -->
  <header class="sticky top-0 z-20 bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-emerald-500 text-white font-bold flex items-center justify-center text-lg shadow">Rp</div>
      <div>
        <h1 class="font-bold text-base leading-tight">Keuangan Reynando</h1>
        <p id="syncStatus" class="text-xs text-emerald-500 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> Google Sheets Terhubung
        </p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="exportCSV()" class="px-3 py-1.5 rounded-lg bg-slate-200 dark:bg-slate-800 text-xs font-semibold hover:opacity-90">
        📥 CSV
      </button>
      <button onclick="toggleTheme()" id="themeBtn" class="w-9 h-9 rounded-lg bg-slate-200 dark:bg-slate-800 flex items-center justify-center text-base">
        ☀️
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">
    <!-- Kartu Saldo -->
    <section class="rounded-2xl p-5 bg-gradient-to-br from-emerald-900 to-slate-900 text-white shadow-lg border border-emerald-700/40">
      <div class="flex items-center justify-between mb-1">
        <span class="text-xs uppercase tracking-wider text-emerald-200/80">Sisa Saldo</span>
        <select id="filterWaktu" onchange="renderAll()" class="bg-slate-800/80 text-xs rounded-lg px-2.5 py-1 border border-slate-700 text-slate-200 outline-none">
          <option value="all">Semua Waktu</option>
          <option value="today">Hari Ini</option>
          <option value="month">Bulan Ini</option>
        </select>
      </div>
      <div id="saldoText" class="text-3xl font-extrabold tracking-tight my-2">Rp0</div>
      <div class="grid grid-cols-2 gap-3 pt-3 border-t border-white/10 text-sm">
        <div>
          <p class="text-xs text-emerald-300">▼ Pemasukan</p>
          <p id="masukText" class="font-bold text-base">Rp0</p>
        </div>
        <div>
          <p class="text-xs text-rose-300">▲ Pengeluaran</p>
          <p id="keluarText" class="font-bold text-base">Rp0</p>
        </div>
      </div>
    </section>

    <!-- Grafik Kategori -->
    <section class="rounded-2xl p-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3">Ringkasan Kategori Pengeluaran</h2>
      <div class="h-48 flex items-center justify-center">
        <canvas id="kategoriChart"></canvas>
      </div>
    </section>

    <!-- Pencarian & Filter -->
    <section class="space-y-2.5">
      <input id="searchInput" oninput="renderAll()" type="text" placeholder="🔍 Cari transaksi (misal: Jajan, Kopi, Gaji)..."
        class="w-full px-4 py-2.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm outline-none focus:border-emerald-500" />
      <div class="flex gap-2 text-xs font-semibold">
        <button onclick="setFilterTipe('all')" id="btn-all" class="px-3.5 py-1.5 rounded-full bg-emerald-500 text-white">Semua</button>
        <button onclick="setFilterTipe('pengeluaran')" id="btn-pengeluaran" class="px-3.5 py-1.5 rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">Pengeluaran</button>
        <button onclick="setFilterTipe('pemasukan')" id="btn-pemasukan" class="px-3.5 py-1.5 rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">Pemasukan</button>
      </div>
    </section>

    <!-- Daftar Transaksi -->
    <section id="listTransaksi" class="space-y-2.5"></section>
  </main>

  <!-- Tombol Tambah Manual -->
  <button onclick="openModal()" class="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-emerald-500 hover:bg-emerald-600 text-white text-3xl shadow-xl flex items-center justify-center">+</button>

  <!-- Modal Tambah -->
  <div id="modalForm" class="hidden fixed inset-0 z-30 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-2xl p-5 border border-slate-200 dark:border-slate-800 space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-base">Catat Transaksi Manual</h3>
        <button onclick="closeModal()" class="text-slate-400 text-xl">✕</button>
      </div>
      <select id="inpTipe" class="w-full p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm outline-none">
        <option value="pengeluaran">Pengeluaran</option>
        <option value="pemasukan">Pemasukan</option>
      </select>
      <input id="inpKet" type="text" placeholder="Keterangan (misal: Jajan Bakso)" class="w-full p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm outline-none" />
      <input id="inpNom" type="number" placeholder="Nominal (misal: 15000)" class="w-full p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm outline-none" />
      <button onclick="simpanManual()" id="btnSimpan" class="w-full py-2.5 rounded-xl bg-emerald-500 text-white font-bold text-sm">Simpan Transaksi</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxo9d-hq7LlDREH0eDQOZ3CJCRUl62ajDNHDvkSJBXEKYdR8QlF6pEFG4SuqoJKc95T/exec';
    let allData = [];
    let filterTipe = 'all';
    let chartInstance = null;

    function toggleTheme() {
      const html = document.documentElement;
      html.classList.toggle('dark');
      const isDark = html.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
      renderChart(getFilteredData());
    }

    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark');
      document.getElementById('themeBtn').textContent = '🌙';
    }

    function setFilterTipe(tipe) {
      filterTipe = tipe;
      ['all', 'pengeluaran', 'pemasukan'].forEach(t => {
        const el = document.getElementById('btn-' + t);
        el.className = t === tipe
          ? 'px-3.5 py-1.5 rounded-full bg-emerald-500 text-white'
          : 'px-3.5 py-1.5 rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800';
      });
      renderAll();
    }

    async function loadData() {
      try {
        const res = await fetch(SCRIPT_URL);
        allData = await res.json();
        document.getElementById('syncStatus').innerHTML =
          '<span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> Tersinkron';
        renderAll();
      } catch (e) {
        document.getElementById('syncStatus').innerHTML =
          '<span class="w-2 h-2 rounded-full bg-amber-500 inline-block"></span> Gagal memuat data';
      }
    }

    function getFilteredData() {
      const waktu = document.getElementById('filterWaktu').value;
      const q = document.getElementById('searchInput').value.toLowerCase();
      const now = new Date();
      const todayStr = now.toISOString().slice(0, 10);
      const monthStr = now.toISOString().slice(0, 7);

      return allData.filter(item => {
        if (waktu === 'today' && !String(item.tanggal).startsWith(todayStr)) return false;
        if (waktu === 'month' && !String(item.tanggal).startsWith(monthStr)) return false;
        if (filterTipe !== 'all' && item.tipe !== filterTipe) return false;
        if (q && !item.keterangan.toLowerCase().includes(q) && !item.kategori.toLowerCase().includes(q)) return false;
        return true;
      });
    }

    function renderAll() {
      const filtered = getFilteredData();
      const masuk = filtered.filter(d => d.tipe === 'pemasukan').reduce((a, b) => a + Number(b.nominal), 0);
      const keluar = filtered.filter(d => d.tipe === 'pengeluaran').reduce((a, b) => a + Number(b.nominal), 0);

      document.getElementById('saldoText').textContent = 'Rp' + (masuk - keluar).toLocaleString('id-ID');
      document.getElementById('masukText').textContent = 'Rp' + masuk.toLocaleString('id-ID');
      document.getElementById('keluarText').textContent = 'Rp' + keluar.toLocaleString('id-ID');

      const listEl = document.getElementById('listTransaksi');
      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="text-center text-xs text-slate-400 py-8">Belum ada transaksi</div>';
      } else {
        listEl.innerHTML = filtered.map(item => {
          const isMasuk = item.tipe === 'pemasukan';
          const tgl = new Date(item.tanggal).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
          return `
            <div class="p-3.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex items-center justify-between">
              <div>
                <p class="font-semibold text-sm">${item.keterangan}</p>
                <p class="text-xs text-slate-400">${item.kategori} • ${tgl}</p>
              </div>
              <div class="flex items-center gap-3">
                <span class="font-bold text-sm ${isMasuk ? 'text-emerald-500' : 'text-rose-500'}">
                  ${isMasuk ? '+' : '-'}Rp${Number(item.nominal).toLocaleString('id-ID')}
                </span>
                <button onclick="hapusData(${item.id})" class="text-xs text-slate-400 hover:text-rose-500">🗑️</button>
              </div>
            </div>`;
        }).join('');
      }

      renderChart(filtered);
    }

    function renderChart(data) {
      const keluar = data.filter(d => d.tipe === 'pengeluaran');
      const map = {};
      keluar.forEach(d => { map[d.kategori] = (map[d.kategori] || 0) + Number(d.nominal); });

      const labels = Object.keys(map);
      const values = Object.values(map);
      const ctx = document.getElementById('kategoriChart').getContext('2d');

      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels.length ? labels : ['Belum ada data'],
          datasets: [{
            data: values.length ? values : [1],
            backgroundColor: values.length
              ? ['#10b981', '#f43f5e', '#3b82f6', '#f59e0b', '#8b5cf6', '#64748b']
              : ['#334155'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right',
              labels: { color: document.documentElement.classList.contains('dark') ? '#cbd5e1' : '#334155', font: { size: 11 } }
            }
          }
        }
      });
    }

    function openModal() { document.getElementById('modalForm').classList.remove('hidden'); }
    function closeModal() { document.getElementById('modalForm').classList.add('hidden'); }

    async function simpanManual() {
      const tipe = document.getElementById('inpTipe').value;
      const keterangan = document.getElementById('inpKet').value.trim();
      const nominal = Number(document.getElementById('inpNom').value);
      if (!keterangan || !nominal) return;

      const btn = document.getElementById('btnSimpan');
      btn.textContent = 'Menyimpan...';
      await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'create', tipe, keterangan, nominal })
      });
      btn.textContent = 'Simpan Transaksi';
      document.getElementById('inpKet').value = '';
      document.getElementById('inpNom').value = '';
      closeModal();
      loadData();
    }

    async function hapusData(id) {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', id })
      });
      loadData();
    }

    function exportCSV() {
      let csv = 'Tanggal,Jenis,Kategori,Keterangan,Nominal\n';
      allData.forEach(item => {
        const tgl = new Date(item.tanggal).toLocaleString('id-ID');
        csv += `"${tgl}",${item.tipe},${item.kategori},"${item.keterangan.replace(/"/g, '""')}",${item.nominal}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Laporan_KeuanganWA.csv';
      a.click();
    }

    loadData();
    setInterval(loadData, 5000);
  </script>
</body>
</html>
